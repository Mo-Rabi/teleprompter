name: Build Floating Teleprompter APK

on:
  push:
    branches: [feature/android-floating-teleprompter]
    paths:
      - 'android-floating/**'
      - '.github/workflows/android-floating-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-floating/**'
      - '.github/workflows/android-floating-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runners already contain an Android SDK; avoid the
      # setup-android action that tries to fetch retired "tools" packages.
      - name: Verify Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle --no-daemon -p android-floating assembleDebug
      - name: Verify APK exists
        run: test -s android-floating/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicWithMo-Floating-Teleprompter-APK
          path: android-floating/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish permanently downloadable APK as GitHub prerelease
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/android-floating-teleprompter') || (github.event_name == 'pull_request' && github.head_ref == 'feature/android-floating-teleprompter' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="floating-teleprompter-v2-debug"
          APK="android-floating/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#ArabicWithMo_Floating_Teleprompter_v2_Debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#ArabicWithMo_Floating_Teleprompter_v2_Debug.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ArabicWithMo Floating Teleprompter v2 — Android Debug APK" \
              --notes "Personal testing build; unsigned-for-distribution, debug-signed. Requires Display over other apps permission. Tested in CI, not yet on Huawei P30 Pro." \
              --prerelease
          fi
